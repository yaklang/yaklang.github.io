# yaklang.com 生产 nginx 参考配置 —— 2026-08-31 GEO 审计 P0-3 全部项。
#
# 覆盖审计发现：
#   [High] soft 404   → error_page 404 + try_files 兜底 =404（不再回退首页）
#   [High] 安全头全缺 → server 级 HSTS/X-Content-Type-Options/X-Frame-Options/
#                        Referrer-Policy/Permissions-Policy（CSP 可 report-only 起步）
#   [Medium] 仅 HTTP/1.1 → listen ... http2（TLS 层，1.25+ 用 http2 on; 指令）
#   [Medium] 无 Brotli   → brotli on（需 ngx_brotli 模块；不可用时回退 gzip）
#   [Medium] www 重复主机 200 → www.yaklang.com 301 到裸域
#   [Medium] HTML 无 Cache-Control → map 按 URI 统一设置
#
# 注意：nginx 的 add_header 不向下继承——location 内一旦出现 add_header，
# server 级头部即失效。故本配置用 map 设 Cache-Control，避免在 location
# 里写 add_header。

map $uri $cache_control {
    default                                                              "public, max-age=300";
    "~*\.(?:css|js|mjs|map|woff2?|png|jpg|jpeg|gif|webp|avif|svg|ico)$"  "public, max-age=31536000, immutable";
    "~*^/(?:robots\.txt|llms\.txt|llms-full\.txt|llm\.txt|sitemap\.xml)$" "no-cache";
}

# —— www → 裸域 301（消除重复主机 200）——
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx <1.25.1 改用: listen 443 ssl http2;
    server_name www.yaklang.com;

    # ssl_certificate     /etc/nginx/certs/yaklang.com.pem;
    # ssl_certificate_key /etc/nginx/certs/yaklang.com.key;

    return 301 https://yaklang.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name yaklang.com;
    # HTTP → HTTPS 301
    return 301 https://yaklang.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx <1.25.1 改用: listen 443 ssl http2;
    server_name yaklang.com;

    # ssl_certificate     /etc/nginx/certs/yaklang.com.pem;
    # ssl_certificate_key /etc/nginx/certs/yaklang.com.key;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    # —— [High] 消灭 soft 404：不存在路径返回真 404（Docusaurus 404 页）——
    error_page 404 /404.html;

    # —— 压缩：Brotli 优先（需 ngx_brotli），gzip 兜底 ——
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/xml application/javascript
    #              application/json image/svg+xml application/xml;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/javascript
               application/json image/svg+xml application/xml application/wasm;

    # —— [High] 安全响应头五件套（server 级，所有 location 继承）——
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP 建议 report-only 起步，确认无误报后再去掉 -Report-Only：
    # add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' data: https:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control $cache_control always;
    # 显式授权 AI 摘录无长度截断（2026-08-31 审计 F-8；与页面 meta robots
    # 冲突时搜索引擎取更严格者，noindex 页不受影响）
    add_header X-Robots-Tag "index, follow, max-snippet:-1, max-image-preview:large" always;

    # 直跳带尾斜杠的 canonical 目标，消除两跳重定向链
    location = /docs {
        return 301 /docs/intro/;
    }
    location = /docs/ {
        return 301 /docs/intro/;
    }

    # /products/ 目录无 index.html，try_files 会 403——直跳真实手册入口
    # （2026-08-31 第三次审计 [Low]）
    location = /products/ {
        return 301 /products/intro/;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
